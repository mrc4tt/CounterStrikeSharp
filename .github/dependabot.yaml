version: 2
updates:
  # Bump hl2sdk-cs2 (mrc4tt/hl2sdk cs2), metamod-source and Protobufs daily.
  # The gitsubmodule ecosystem follows each submodule's `branch` in .gitmodules.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    allow:
      - dependency-name: "libraries/hl2sdk-cs2"
      - dependency-name: "libraries/metamod-source"
      - dependency-name: "libraries/Protobufs"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps)"
