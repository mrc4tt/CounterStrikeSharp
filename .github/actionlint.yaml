# build-and-publish.yml never runs on GitHub: it is driven locally through act,
# which executes JS actions with the node inside the runner image and cannot use
# the node24 majors of the artifact / release actions (see the header comment in
# that workflow). The node20 deprecation does not apply to it.
paths:
  .github/workflows/build-and-publish.yml:
    ignore:
      - 'runtime "node20" is deprecated'

# Label of the self-hosted runner that holds the CS2 binary archive, used by
# gamedata-signature-check.yml. actionlint only knows GitHub's own labels, so
# custom ones have to be declared here or every use is flagged as unknown.
self-hosted-runner:
  labels:
    - cs2-binaries
