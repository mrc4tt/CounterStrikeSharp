name: Synchronize - Schema

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  update-schema:
    runs-on: ubuntu-latest
    if: github.repository == 'mrc4tt/CounterStrikeSharp'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: denoland/setup-deno@v2

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp ncat

      - name: Preflight - probe RCON reachability
        env:
          GS_HOST: ${{ secrets.GS_HOST }}
          GS_PORT: ${{ secrets.GS_PORT }}
        run: |
          if [ -z "$GS_HOST" ] || [ -z "$GS_PORT" ]; then
            echo "::error::GS_HOST or GS_PORT secret is empty — secrets aren't being injected."
            exit 1
          fi
          echo "Resolving $GS_HOST..."
          getent hosts "$GS_HOST" || { echo "::error::DNS resolution failed for $GS_HOST"; exit 1; }
          echo "Probing TCP $GS_HOST:$GS_PORT (5s timeout)..."
          if ! ncat -w 5 -z -v "$GS_HOST" "$GS_PORT"; then
            echo "::error::RCON port $GS_PORT unreachable from GitHub runner. Likely cause: Pterodactyl/host firewall is blocking the runner's IP, RCON isn't bound (rcon_password unset in server.cfg), or the server is down."
            exit 1
          fi

      - name: Run schema update script
        env:
          GS_HOST: ${{ secrets.GS_HOST }}
          GS_PORT: ${{ secrets.GS_PORT }}
          GS_PASS: ${{ secrets.GS_PASS }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          mkdir -p ~/.lftp
          echo "set sftp:auto-confirm yes" >> ~/.lftp/rc
          echo "set ssl:verify-certificate no" >> ~/.lftp/rc
          chmod +x eng/update-schema.ts
          chmod +x eng/rcon
          for attempt in 1 2 3 4 5; do
            if ./eng/update-schema.ts; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::update-schema failed after 5 attempts (RCON unreachable)."
              exit 1
            fi
            echo "::warning::update-schema attempt $attempt failed, retrying in 30s..."
            sleep 30
          done

      - name: Get patch version
        id: version
        run: |
          SCHEMA=managed/CounterStrikeSharp.SchemaGen/Schema/server.json
          # Strip C0 control chars (except \t \n \r) that CS2 dump_schema sometimes emits inside string values.
          python3 -c "import re,sys,pathlib; p=pathlib.Path('$SCHEMA'); d=p.read_bytes().decode('utf-8','replace'); p.write_text(re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f]','',d), encoding='utf-8')"
          PATCH_VERSION=$(jq -r ".game_info.PatchVersion" "$SCHEMA")
          echo "patch_version=$PATCH_VERSION" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain managed/CounterStrikeSharp.API/Generated/) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in Generated folder:"
            git status --porcelain managed/CounterStrikeSharp.API/Generated/
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.AUTOMATED_PR_PAT }}
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          commit-message: "chore: update schema definitions to ${{ steps.version.outputs.patch_version }}"
          title: "chore: Update Schema Definitions to ${{ steps.version.outputs.patch_version }}"
          body: |
            This PR was automatically generated by the schema update workflow.

            ## Changes
            - Updated schema definitions from the game server
            - Regenerated schema code using `CounterStrikeSharp.SchemaGen`
            - Patch Version: `${{ steps.version.outputs.patch_version }}`

            ---
            *This is an automated PR. Please review the changes before merging.*
          branch: chore/automated/schema-update
          delete-branch: true

      - name: No changes detected
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "::notice::No schema changes detected. No PR will be created."
