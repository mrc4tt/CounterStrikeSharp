name: actionlint

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - ".github/actionlint.yaml"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error