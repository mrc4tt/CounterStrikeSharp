name: Build & Publish (Linux + Windows + Managed)

env:
  BUILD_TYPE: Release

# Remove default permissions of GITHUB_TOKEN for security
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

# This workflow does NOT auto-run on GitHub — no push/PR trigger.
# It is driven entirely locally via `act` (create-release.sh) to build and
# publish both halves of a release. Windows is cross-compiled on Linux with
# clang-cl (build_windows); there is no MSVC build any more.
# Run locally: `act workflow_dispatch --input confirm_local=LOCAL`
#
# Action versions here are capped by what act can run. Tested against act
# 0.2.87 and 0.2.89:
#   - upload-artifact >= v6 / download-artifact >= v7: act's artifact server
#     answers "unauthorized"; upload-artifact v7 additionally sends a
#     `mime_type` field it cannot decode. v5 / v6 are the newest that work.
#   - softprops/action-gh-release v3 requires node >= 24, and act runs JS
#     actions with the node inside catthehacker/ubuntu:full-latest (v22).
# gittools/actions v4 needs GitVersion >= 6.2, hence versionSpec 6.x; 6.8.2
# computes the same version as 6.0.5 on this repo.
on:
  workflow_dispatch:
    inputs:
      confirm_local:
        description: 'Set to LOCAL to run the publish job. Used by act; leave empty on GitHub to skip release.'
        required: false
        default: ''

jobs:
  setup:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      gitversion_semver: ${{ steps.gitversion.outputs.semVer }}
      gitversion_fullsemver: ${{ steps.gitversion.outputs.fullSemVer }}
      gitversion_assemblysemver: ${{ steps.gitversion.outputs.assemblySemVer }}
      gitversion_informationalversion: ${{ steps.gitversion.outputs.informationalVersion }}
    steps:
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: 6.x

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Execute GitVersion
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4
      with:
        configFilePath: GitVersion.yml

  build_linux:
    needs: setup
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      # GitHub injects a node runtime into custom containers automatically; act
      # does not. JS-based actions (checkout, upload-artifact, etc.) need node,
      # so install it ourselves when running under act.
      - name: Install Node.js (act only)
        if: ${{ env.ACT == 'true' }}
        shell: bash
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "Installing node.js for act..."
            # Deliberately no apt. The sniper SDK image is Debian 11 (bullseye),
            # now EOL: bullseye-security's index still lists package versions
            # whose .deb files were pruned from the pool, so any
            # `apt-get install` that pulls an upgrade (ca-certificates did)
            # dies with 404 / exit 100 - and the NodeSource setup script runs
            # the same install internally. The image already ships curl, tar
            # and xz, and the official node binaries only need glibc >= 2.28
            # (bullseye has 2.31), so unpack the tarball straight from nodejs.org.
            node_base=https://nodejs.org/dist/latest-v24.x
            node_sums=$(curl -fsSL "$node_base/SHASUMS256.txt")
            node_tarball=$(awk '/linux-x64\.tar\.xz$/ {print $2}' <<< "$node_sums")
            curl -fsSL -o "/tmp/$node_tarball" "$node_base/$node_tarball"
            (cd /tmp && grep " $node_tarball\$" <<< "$node_sums" | sha256sum -c -)
            tar -xJf "/tmp/$node_tarball" -C /usr/local --strip-components=1
            rm -f "/tmp/$node_tarball"
            node --version
          fi

      - name: Prepare env
        shell: bash
        run: |
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "SEMVER=${{ needs.setup.outputs.gitversion_semver }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ..
          cmake --build . --config ${{env.BUILD_TYPE}} -- -j16

      - name: Clean build directory
        run: |
          mkdir build/output/
          mv build/addons build/output

      - uses: actions/upload-artifact@v5
        with:
          name: counterstrikesharp-linux-${{ needs.setup.outputs.gitversion_semver }}
          path: build/output/

  build_windows:
    # Cross-compiled with clang-cl + lld-link against an MSVC CRT/SDK splatted
    # by xwin, via makefiles/toolchain-win64-clang-cl.cmake. create-release.sh
    # mounts the host's ~/.xwin at /opt/xwin when it exists; without it this job
    # splats a fresh copy (~630MB download).
    needs: setup
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      XWIN_VERSION: "0.6.6"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      # Needs LLVM >= 19: the xwin MSVC STL static_asserts "STL1000: Unexpected
      # compiler version, expected Clang 19.0.0 or newer", and noble's default
      # clang is 18. 20 is in the noble archive. The toolchain file falls back
      # to llvm-ml --m64 since llvm-20 does not package the llvm-ml64 alias.
      # Every LLVM install carries the tools under /usr/lib/llvm-<N>/bin with
      # plain names; only the /usr/bin symlinks are distro-dependent, so resolve
      # a bin directory.
      - name: Install the LLVM cross toolchain
        id: llvm
        run: |
          set -euo pipefail
          sudo=$(command -v sudo || true)
          $sudo apt-get update -qq
          $sudo apt-get install -y -qq clang-20 lld-20 llvm-20 cmake ninja-build

          tools="clang-cl lld-link llvm-lib llvm-rc llvm-mt llvm-ml llvm-readobj"
          binDir=""
          while IFS= read -r dir; do
            complete=1
            for tool in $tools; do
              [ -x "$dir/$tool" ] || complete=0
            done
            if [ "$complete" = 1 ]; then binDir=$dir; break; fi
          done < <(find /usr/lib -mindepth 2 -maxdepth 2 -type d -path '/usr/lib/llvm-*/bin' | sort -V | tac)
          if [ -z "$binDir" ]; then
            echo "::error::No LLVM install has the full cross toolchain ($tools)."
            exit 1
          fi
          "$binDir/clang-cl" --version
          echo "binDir=$binDir" >> "$GITHUB_OUTPUT"

      - name: Splat the MSVC CRT and Windows SDK
        id: xwin
        run: |
          set -euo pipefail
          if [ -d /opt/xwin/crt/include ]; then
            echo "root=/opt/xwin" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "${{ runner.temp }}"
          curl -fsSL -o xwin.tar.gz \
            "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar xzf xwin.tar.gz
          "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" \
            --accept-license --arch x86_64 splat --output "${{ runner.temp }}/xwin"
          rm -rf .xwin-cache xwin.tar.gz "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl"
          echo "root=${{ runner.temp }}/xwin" >> "$GITHUB_OUTPUT"

      # Build outside the workspace: act copies the local working tree, and a
      # host build-win64/ with its CMakeCache.txt could come along with it.
      - name: Build
        run: |
          cmake -S . -B "${{ runner.temp }}/build-win64" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=makefiles/toolchain-win64-clang-cl.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DLLVM_TOOLCHAIN_BIN='${{ steps.llvm.outputs.binDir }}' \
            -DXWIN_ROOT='${{ steps.xwin.outputs.root }}'
          cmake --build "${{ runner.temp }}/build-win64" -j"$(nproc)"

      # Metamod loads the plugin through CreateInterface and the managed host
      # calls in through InvokeNative; a DLL without either links but is useless.
      - name: Check exports and stage
        run: |
          set -euo pipefail
          build="${{ runner.temp }}/build-win64"
          dll="$build/counterstrikesharp.dll"
          for symbol in CreateInterface InvokeNative; do
            "${{ steps.llvm.outputs.binDir }}/llvm-readobj" --coff-exports "$dll" | grep -q "Name: $symbol\$" || {
              echo "::error::$symbol is not exported"
              exit 1
            }
          done
          mkdir -p "$build/output/addons/counterstrikesharp/bin/win64"
          cp -r "$build/addons/." "$build/output/addons/"
          cp "$dll" "$build/output/addons/counterstrikesharp/bin/win64/"

      - uses: actions/upload-artifact@v5
        with:
          name: counterstrikesharp-windows-${{ needs.setup.outputs.gitversion_semver }}
          path: ${{ runner.temp }}/build-win64/output/

  tests_cpp:
    # Host-arch unit tests for src/core/tests/*. Runs on plain ubuntu-latest
    # (no SteamRT container) because these tests are deliberately decoupled
    # from the hl2sdk-cs2 build -- they mirror the production logic and only
    # need a C++17 compiler + Catch2 (consumed via the libraries/Catch2
    # submodule's amalgamated single-source).
    needs: setup
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Only Catch2 is needed -- pulling all submodules would clone
          # hl2sdk-cs2, Protobufs, etc. unnecessarily on this lightweight job.
          submodules: false

      - name: Fetch Catch2 submodule
        run: git submodule update --init --depth 1 libraries/Catch2

      - name: Configure (tests only)
        run: |
          # Skip the full CMake project (dyncall's old cmake_minimum_required
          # breaks modern CMake). Compile the test target directly -- this is
          # the same command the maintainer runs locally.
          mkdir -p build-tests
          cd build-tests
          clang++ -std=c++17 -O0 -Wall \
            -I../libraries/Catch2/extras \
            -I../src \
            ../src/core/tests/test_timer_system_startup.cpp \
            ../libraries/Catch2/extras/catch_amalgamated.cpp \
            -o css_unit_tests
      - name: Run
        run: ./build-tests/css_unit_tests --reporter=console

  build_managed:
    needs: setup
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Prepare env
        shell: bash
        run: echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # We don't need expensive submodules for the managed side.
      - uses: actions/checkout@v7

      - name: Build runtime v${{ needs.setup.outputs.gitversion_semver }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: dotnet restore managed/CounterStrikeSharp.sln

      - name: Run tests
        run: dotnet test --logger trx --results-directory "TestResults-${{ needs.setup.outputs.gitversion_semver }}" managed/CounterStrikeSharp.API.Tests/CounterStrikeSharp.API.Tests.csproj

      - name: Upload dotnet test results
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ needs.setup.outputs.gitversion_semver }}
          path: TestResults-${{ needs.setup.outputs.gitversion_semver }}
        if: ${{ always() }}

      - name: Publish artifacts
        run: |
          dotnet publish -c Release \
          /p:Version=${{ needs.setup.outputs.gitversion_semver }} \
          /p:AssemblyVersion=${{ needs.setup.outputs.gitversion_assemblySemver }} \
          /p:InformationalVersion=${{ needs.setup.outputs.gitversion_informationalversion }} \
          managed/CounterStrikeSharp.API

          dotnet pack -c Release \
          /p:Version=${{ needs.setup.outputs.gitversion_semver }} \
          /p:AssemblyVersion=${{ needs.setup.outputs.gitversion_assemblySemver }} \
          /p:InformationalVersion=${{ needs.setup.outputs.gitversion_informationalversion }} \
          managed/CounterStrikeSharp.API

          # RayTrace compat plugin (managed/RayTrace), same as build.sh's build_raytrace.
          # Lands under bin/Release/raytrace so it rides in the API artifact without
          # moving net10.0/publish. RayTraceApi goes to shared/ only - a private copy
          # next to the plugin splits the capability's type identity.
          for p in RayTraceImpl:plugins RayTraceApi:shared; do
            dotnet publish -c Release --no-self-contained \
            /p:Version=${{ needs.setup.outputs.gitversion_semver }} \
            /p:AssemblyVersion=${{ needs.setup.outputs.gitversion_assemblySemver }} \
            /p:InformationalVersion=${{ needs.setup.outputs.gitversion_informationalversion }} \
            -o managed/CounterStrikeSharp.API/bin/Release/raytrace/${p#*:}/${p%%:*} \
            managed/RayTrace/${p%%:*}/${p%%:*}.csproj
          done

      - uses: actions/upload-artifact@v5
        with:
          name: counterstrikesharp-api-${{ needs.setup.outputs.gitversion_semver }}
          path: managed/CounterStrikeSharp.API/bin/Release

  # Publish runs ONLY when workflow_dispatch is invoked with confirm_local=LOCAL.
  # Push/PR skip it. GitHub UI "Run workflow" skips it unless you type LOCAL.
  # Run locally with:
  #   git checkout vX.Y.Z
  #   act workflow_dispatch \
  #     --input confirm_local=LOCAL \
  #     -P ubuntu-latest=catthehacker/ubuntu:full-latest \
  #     --artifact-server-path /tmp/act-artifacts \
  #     -s GITHUB_TOKEN=$CSS_RELEASE_TOKEN
  publish:
    if: ${{ github.event.inputs.confirm_local == 'LOCAL' && github.repository == 'mrc4tt/CounterStrikeSharp' }}
    permissions:
      contents: write
    needs: ["setup", "build_linux", "build_windows", "build_managed"]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare env
        shell: bash
        run: echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          name: counterstrikesharp-linux-${{ needs.setup.outputs.gitversion_semver }}
          path: build/linux

      - uses: actions/download-artifact@v6
        with:
          name: counterstrikesharp-windows-${{ needs.setup.outputs.gitversion_semver }}
          path: build/windows

      - uses: actions/download-artifact@v6
        with:
          name: counterstrikesharp-api-${{ needs.setup.outputs.gitversion_semver }}
          path: build/api

      - name: Add API to Linux and Windows artifacts
        run: |
          for os in linux windows; do
            mkdir -p build/$os/addons/counterstrikesharp/api
            cp -r build/api/net10.0/publish/* build/$os/addons/counterstrikesharp/api
            cp -r build/api/raytrace/* build/$os/addons/counterstrikesharp/
          done

      # The shipped .so loses its symbol table (~2 MB of the 6.8 MB). No separate
      # .so.debug is published any more.
      - name: Strip native symbols
        run: strip --strip-unneeded build/linux/addons/counterstrikesharp/bin/linuxsteamrt64/counterstrikesharp.so

      - name: Zip Linux (runtimeless)
        run: (cd build/linux && zip -qq -r ../../counterstrikesharp-linux-${{ needs.setup.outputs.gitversion_semver }}.zip ./*)

      # createdump, libmscordaccore.so and libmscordbi.so only serve crash dumps and managed
      # debuggers (SOS, vsdbg) attaching to the server - none of which this build supports
      # (build.sh drops createdump for the same reason). ~4 MB. dotnet-trace and perf still work.
      - name: Add dotnet runtime
        run: |
          mkdir -p build/linux/addons/counterstrikesharp/dotnet
          curl -s -L https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.3/aspnetcore-runtime-10.0.3-linux-x64.tar.gz \
          | tar xz -C build/linux/addons/counterstrikesharp/dotnet
          find build/linux/addons/counterstrikesharp/dotnet -type f \
            \( -name createdump -o -name libmscordaccore.so -o -name libmscordbi.so \) -delete

      - name: Zip Linux (with runtime)
        run: (cd build/linux && zip -qq -r ../../counterstrikesharp-with-runtime-linux-${{ needs.setup.outputs.gitversion_semver }}.zip ./*)

      # Same, without the ASP.NET Core shared framework (~27 MB unpacked, ~12 MB zipped).
      # CounterStrikeSharp itself only needs Microsoft.NETCore.App; a plugin that references
      # Microsoft.AspNetCore.App (Kestrel, web panels) needs the full with-runtime zip.
      - name: Zip Linux (with slim runtime)
        run: |
          rm -rf build/linux/addons/counterstrikesharp/dotnet/shared/Microsoft.AspNetCore.App
          (cd build/linux && zip -qq -r ../../counterstrikesharp-with-runtime-slim-linux-${{ needs.setup.outputs.gitversion_semver }}.zip ./*)

      - name: Zip Windows (runtimeless)
        run: (cd build/windows && zip -qq -r ../../counterstrikesharp-windows-${{ needs.setup.outputs.gitversion_semver }}.zip ./*)

      # Same reasoning as the Linux runtime step: drop the crash-dump/debugger-only files.
      - name: Add dotnet runtime (Windows)
        run: |
          mkdir -p build/windows/addons/counterstrikesharp/dotnet
          curl -fsSL -o dotnet-win.zip https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.3/aspnetcore-runtime-10.0.3-win-x64.zip
          unzip -qq dotnet-win.zip -d build/windows/addons/counterstrikesharp/dotnet
          rm -f dotnet-win.zip
          find build/windows/addons/counterstrikesharp/dotnet -type f \
            \( -name createdump.exe -o -name 'mscordaccore*.dll' -o -name mscordbi.dll \) -delete

      - name: Zip Windows (with runtime)
        run: (cd build/windows && zip -qq -r ../../counterstrikesharp-with-runtime-windows-${{ needs.setup.outputs.gitversion_semver }}.zip ./*)

      - name: Zip Windows (with slim runtime)
        run: |
          rm -rf build/windows/addons/counterstrikesharp/dotnet/shared/Microsoft.AspNetCore.App
          (cd build/windows && zip -qq -r ../../counterstrikesharp-with-runtime-slim-windows-${{ needs.setup.outputs.gitversion_semver }}.zip ./*)

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
            config: cliff.toml
            args: --current -s footer

      - name: Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |
            ${{ steps.git-cliff.outputs.content }}

            Please refer to [CHANGELOG.md](https://github.com/mrc4tt/CounterStrikeSharp/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
          files: |
            counterstrikesharp-linux-${{ needs.setup.outputs.gitversion_semver }}.zip
            counterstrikesharp-with-runtime-linux-${{ needs.setup.outputs.gitversion_semver }}.zip
            counterstrikesharp-with-runtime-slim-linux-${{ needs.setup.outputs.gitversion_semver }}.zip
            counterstrikesharp-windows-${{ needs.setup.outputs.gitversion_semver }}.zip
            counterstrikesharp-with-runtime-windows-${{ needs.setup.outputs.gitversion_semver }}.zip
            counterstrikesharp-with-runtime-slim-windows-${{ needs.setup.outputs.gitversion_semver }}.zip
