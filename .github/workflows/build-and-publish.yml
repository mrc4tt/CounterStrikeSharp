name: Build & Publish (Linux + Managed)

env:
  BUILD_TYPE: Release

# Remove default permissions of GITHUB_TOKEN for security
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

# Windows native builds live in build-windows.yml (GitHub-only, on tags).
# This workflow runs on GitHub for CI validation (push/PR) and is the one
# driven locally via `act` to cut the actual Linux release.
on:
  push:
    paths-ignore:
      - "docfx/**"
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      confirm_local:
        description: 'Set to LOCAL to run the publish job. Used by act; leave empty on GitHub to skip release.'
        required: false
        default: ''

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      gitversion_semver: ${{ steps.gitversion.outputs.semVer }}
      gitversion_fullsemver: ${{ steps.gitversion.outputs.fullSemVer }}
      gitversion_assemblysemver: ${{ steps.gitversion.outputs.assemblySemVer }}
      gitversion_informationalversion: ${{ steps.gitversion.outputs.informationalVersion }}
    steps:
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v1
      with:
        versionSpec: 6.0.x

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Execute GitVersion
      id: gitversion
      uses: gittools/actions/gitversion/execute@v1
      with:
        useConfigFile: true

  build_linux:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      # GitHub injects a node runtime into custom containers automatically; act
      # does not. JS-based actions (checkout, upload-artifact, etc.) need node,
      # so install it ourselves when running under act.
      - name: Install Node.js (act only)
        if: ${{ env.ACT == 'true' }}
        shell: bash
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "Installing node.js for act..."
            apt-get update
            apt-get install -y curl ca-certificates
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y nodejs
            node --version
          fi

      - name: Prepare env
        shell: bash
        run: |
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "SEMVER=${{ needs.setup.outputs.gitversion_semver }}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ..
          cmake --build . --config ${{env.BUILD_TYPE}} -- -j16

      - name: Clean build directory
        run: |
          mkdir build/output/
          mv build/addons build/output

      - uses: actions/upload-artifact@v4
        with:
          name: counterstrikesharp-linux-${{ needs.setup.outputs.gitversion_semver }}
          path: build/output/

  build_managed:
    needs: setup
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Prepare env
        shell: bash
        run: echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # We don't need expensive submodules for the managed side.
      - uses: actions/checkout@v4

      - name: Build runtime v${{ needs.setup.outputs.gitversion_semver }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: dotnet restore managed/CounterStrikeSharp.sln

      - name: Run tests
        run: dotnet test --logger trx --results-directory "TestResults-${{ needs.setup.outputs.gitversion_semver }}" managed/CounterStrikeSharp.API.Tests/CounterStrikeSharp.API.Tests.csproj

      - name: Upload dotnet test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ needs.setup.outputs.gitversion_semver }}
          path: TestResults-${{ needs.setup.outputs.gitversion_semver }}
        if: ${{ always() }}

      - name: Publish artifacts
        run: |
          dotnet publish -c Release \
          /p:Version=${{ needs.setup.outputs.gitversion_semver }} \
          /p:AssemblyVersion=${{ needs.setup.outputs.gitversion_assemblySemver }} \
          /p:InformationalVersion=${{ needs.setup.outputs.gitversion_informationalversion }} \
          managed/CounterStrikeSharp.API

          dotnet pack -c Release \
          /p:Version=${{ needs.setup.outputs.gitversion_semver }} \
          /p:AssemblyVersion=${{ needs.setup.outputs.gitversion_assemblySemver }} \
          /p:InformationalVersion=${{ needs.setup.outputs.gitversion_informationalversion }} \
          managed/CounterStrikeSharp.API

      - uses: actions/upload-artifact@v4
        with:
          name: counterstrikesharp-api-${{ needs.setup.outputs.gitversion_semver }}
          path: managed/CounterStrikeSharp.API/bin/Release

  # Publish runs ONLY when workflow_dispatch is invoked with confirm_local=LOCAL.
  # Push/PR skip it. GitHub UI "Run workflow" skips it unless you type LOCAL.
  # Run locally with:
  #   git checkout vX.Y.Z
  #   act workflow_dispatch \
  #     --input confirm_local=LOCAL \
  #     -P ubuntu-latest=catthehacker/ubuntu:full-latest \
  #     --artifact-server-path /tmp/act-artifacts \
  #     -s GITHUB_TOKEN=$CSS_RELEASE_TOKEN
  publish:
    if: ${{ github.event.inputs.confirm_local == 'LOCAL' && github.repository == 'mrc4tt/CounterStrikeSharp' }}
    permissions:
      contents: write
    needs: ["setup", "build_linux", "build_managed"]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare env
        shell: bash
        run: echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: counterstrikesharp-linux-${{ needs.setup.outputs.gitversion_semver }}
          path: build/linux

      - uses: actions/download-artifact@v4
        with:
          name: counterstrikesharp-api-${{ needs.setup.outputs.gitversion_semver }}
          path: build/api

      - name: Add API to Linux artifacts
        run: |
          mkdir -p build/linux/addons/counterstrikesharp/api
          cp -r build/api/net8.0/publish/* build/linux/addons/counterstrikesharp/api

      - name: Zip Linux (runtimeless)
        run: (cd build/linux && zip -qq -r ../../counterstrikesharp-linux-${{ needs.setup.outputs.gitversion_semver }}.zip *)

      - name: Add dotnet runtime
        run: |
          mkdir -p build/linux/addons/counterstrikesharp/dotnet
          curl -s -L https://download.visualstudio.microsoft.com/download/pr/c1371dc2-eed2-47be-9af3-ae060dbe3c7d/bd509e0a87629764ed47608466d183e6/aspnetcore-runtime-8.0.3-linux-x64.tar.gz \
          | tar xvz -C build/linux/addons/counterstrikesharp/dotnet

      - name: Zip Linux (with runtime)
        run: (cd build/linux && zip -qq -r ../../counterstrikesharp-with-runtime-linux-${{ needs.setup.outputs.gitversion_semver }}.zip *)

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
            config: cliff.toml
            args: --current -s footer

      - name: Release
        id: release
        uses: softprops/action-gh-release@v1
        with:
          append_body: true
          body: |
            ${{ steps.git-cliff.outputs.content }}

            Please refer to [CHANGELOG.md](https://github.com/mrc4tt/CounterStrikeSharp/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
          files: |
            counterstrikesharp-linux-${{ needs.setup.outputs.gitversion_semver }}.zip
            counterstrikesharp-with-runtime-linux-${{ needs.setup.outputs.gitversion_semver }}.zip
